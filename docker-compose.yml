services:

  # ── MariaDB ────────────────────────────────────────────────────
  db:
    image: mariadb:11
    container_name: ddcms_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-ddcms_root_pass}
      MARIADB_DATABASE: dire_dawa_cleaning
      MARIADB_USER: ddcms
      MARIADB_PASSWORD: ${DB_PASSWORD:-ddcms_root_pass}
    volumes:
      - db_data:/var/lib/mysql
      # Auto-import schema + seed on first run
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ddcms_net

  # ── Node.js Backend ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ddcms_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ddcms
      DB_PASSWORD: ${DB_PASSWORD:-ddcms_root_pass}
      DB_NAME: dire_dawa_cleaning
      PORT: 5000
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-please_change_this_secret_32chars_min}
      SESSION_EXPIRY_HOURS: ${SESSION_EXPIRY_HOURS:-8}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
    volumes:
      # Persist uploaded inspection photos
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - ddcms_net

  # ── Nginx Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ddcms_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - ddcms_net

volumes:
  db_data:
  uploads_data:
  logs_data:

networks:
  ddcms_net:
    driver: bridge
