services:

  # ── PostgreSQL + PostGIS ─────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4
    container_name: ddcms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dire_dawa_cleaning
      POSTGRES_USER: ddcms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?ERROR: Set DB_PASSWORD in .env file}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/postgresql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddcms -d dire_dawa_cleaning"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - ddcms_net

  # ── Node.js Backend ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ddcms_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ddcms
      DB_PASSWORD: ${DB_PASSWORD:?ERROR: Set DB_PASSWORD in .env file}
      DB_NAME: dire_dawa_cleaning
      PORT: 5000
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?ERROR: Set SESSION_SECRET in .env file (min 32 chars)}
      SESSION_EXPIRY_HOURS: ${SESSION_EXPIRY_HOURS:-8}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - ddcms_net

  # ── Nginx Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ddcms_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - ddcms_net

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
  logs_data:
    driver: local

networks:
  ddcms_net:
    driver: bridge
