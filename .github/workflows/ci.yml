name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: dire_dawa_cleaning
          POSTGRES_USER: ddcms
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ddcms -d dire_dawa_cleaning"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U ddcms && break || sleep 2
          done

      - name: Import database schema
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: psql -h 127.0.0.1 -p 5432 -U ddcms -d dire_dawa_cleaning < database/postgresql/schema.sql

      - name: Run backend tests
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USER: ddcms
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: dire_dawa_cleaning
          NODE_ENV: test
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PAYMENT_WEBHOOK_SECRET: ${{ secrets.PAYMENT_WEBHOOK_SECRET }}
          CORS_ORIGINS: ""
        run: |
          npm ci
          npm test
